<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservation Calendar</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS (for modal functionality) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="CalendarStyles.css">
</head>
<body class="bg-light">
    <div class="container">
        <h2 class="text-center my-4">Reservation Calendar</h2>
        <div id="calendar"></div>
    </div>

    <!-- Time Slot Selection Modal -->
    <div id="timeSlotModal" class="modal-custom">
        <div class="modal-content-custom">
            <h5 id="modalDate"></h5>
            <label for="reservationReason" class="form-label">Reason for Reservation:</label>
            <select id="reservationReason" class="form-select mb-3">
                <option value="faculty meeting">Faculty Meeting</option>
                <option value="interviews">Interviews</option>
                <option value="student meetings">Student Meetings</option>
                <option value="other">Other</option>
            </select>
            <div id="timeSlotContainer" class="d-flex flex-column gap-2"></div>
            <button class="btn btn-primary mt-3" id="submitTimeSlotsBtn">Submit Selected Slots</button>
            <button class="btn btn-secondary mt-2" onclick="closeTimeSlotModal()">Cancel</button>
        </div>
    </div>

    <!-- Name/Email Modal -->
    <div class="modal fade" id="userInfoModal" tabindex="-1" aria-labelledby="userInfoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userInfoModalLabel">Complete Reservation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="userInfoForm">
                        <div class="mb-3">
                            <label for="userName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="userName" required>
                        </div>
                        <div class="mb-3">
                            <label for="userEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="userEmail" required>
                        </div>
                        <button type="submit" class="btn btn-success">Confirm Reservation</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="Calendar.js"></script>
</body>
</html>
